name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python
        run: python -m py_compile app.py database.py ble_bp7255.py
      - name: Check browser JavaScript
        run: node --check static/app.js
      - name: Check launch scripts
        run: bash -n start.command start-demo.command
      - name: Run tests
        run: python -m unittest discover -s tests -v
